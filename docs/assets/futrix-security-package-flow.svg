<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FutrixData security package assurance flow</title>
  <desc id="desc">AI agents call FutrixData, which applies protocol validation, risk evaluation, masking, approval and audit. The public security package verifies those outputs.</desc>
  <rect width="1200" height="520" rx="28" fill="#F6F8FC"/>
  <rect x="28" y="28" width="1144" height="464" rx="24" fill="white" stroke="#DDE5F2"/>

  <text x="600" y="76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F172A">FutrixData Security Package</text>
  <text x="600" y="106" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Public code and evidence that help buyers verify FutrixData's security claims</text>

  <g>
    <rect x="70" y="170" width="210" height="170" rx="18" fill="#EEF6FF" stroke="#BFDBFE"/>
    <text x="175" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#1E3A8A">AI agents</text>
    <text x="175" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">MCP</text>
    <text x="175" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">Skill / CLI</text>
    <text x="175" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">HTTP tools</text>
  </g>

  <path d="M292 255H375" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M365 245L379 255L365 265" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="390" y="145" width="420" height="220" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="600" y="183" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F172A">FutrixData gateway</text>

    <rect x="425" y="212" width="160" height="42" rx="10" fill="#EDE9FE" stroke="#C4B5FD"/>
    <text x="505" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#4C1D95">Protocol contract</text>

    <rect x="615" y="212" width="160" height="42" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="695" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#78350F">Risk evaluation</text>

    <rect x="425" y="274" width="160" height="42" rx="10" fill="#DCFCE7" stroke="#86EFAC"/>
    <text x="505" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">PII masking</text>

    <rect x="615" y="274" width="160" height="42" rx="10" fill="#FFE4E6" stroke="#FDA4AF"/>
    <text x="695" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7F1D1D">Approval + audit</text>
  </g>

  <path d="M823 255H908" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M898 245L912 255L898 265" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="925" y="170" width="205" height="170" rx="18" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="1028" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#14532D">Databases</text>
    <text x="1028" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">PostgreSQL / MySQL</text>
    <text x="1028" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">MongoDB / Redis</text>
    <text x="1028" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">D1 / DynamoDB / ES</text>
  </g>

  <g>
    <rect x="190" y="405" width="820" height="58" rx="16" fill="#0F172A"/>
    <text x="600" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Public verification package</text>
    <text x="600" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#CBD5E1">auditchain · masking · partial riskengine · protocol · evidence verifier · release checksums</text>
  </g>

  <path d="M600 370V397" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <path d="M590 388L600 402L610 388" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
